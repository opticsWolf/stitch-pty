[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "stitch-pty"
version = "0.5.6"
description = "Cross-platform async PTY with integrated terminal emulation for Python"
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
authors = [
    { name = "stitch-pty authors" }
]

[project.urls]
Homepage = "https://github.com/opticsWolf/stitch-pty"
Repository = "https://github.com/opticsWolf/stitch-pty"
Changelog = "https://github.com/opticsWolf/stitch-pty/releases"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Shells",
    "Topic :: Terminals",
]
keywords = ["pty", "terminal", "async", "rust", "posix"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "maturin>=1.8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.maturin]
features = ["pyo3/extension-module", "python"]
python-source = "python"
module-name = "stitch_pty._core"
manifest-path = "Cargo.toml"
compatibility = "manylinux_2_28"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
