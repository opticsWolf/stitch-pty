[package]
name = "stitch-pty"
version = "0.5.0"
edition = "2024"
authors = ["stitch-pty authors"]
description = "Cross-platform async PTY with integrated terminal emulation for Python"
license = "MIT OR Apache-2.0"
repository = "https://github.com/stitch-pty/stitch-pty"

[lib]
crate-type = ["cdylib"]
name = "stitch_pty"

[dependencies]
# PyO3 bindings for Python
pyo3 = { version = "0.28", features = ["extension-module", "abi3-py312"] }
pyo3-async-runtimes = { version = "0.28", features = ["tokio-runtime"] }

# Async runtime
tokio = { version = "1.52", features = ["full", "process", "net", "io-util"] }
tokio-util = { version = "0.7", features = ["codec"] }

# Error handling
thiserror = "2.0"
tracing = "0.1"
once_cell = "1.21"
parking_lot = "0.12"
async-trait = "0.1"

# Terminal emulation (from pyte_rs)
unicode-width = "0.2"
unicode-segmentation = "1.13"
bitflags = "2.13"

# Platform-specific dependencies
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["process", "term", "signal", "poll", "ioctl", "fs"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_SystemServices",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
